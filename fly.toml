app = 'mieyar-whatsapp-agent'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'
  DATA_DIR = '/data'
  KNOWLEDGE_URL = 'https://mieyar-website.fly.dev/knowledge.json'
  WEBSITE_URL = 'https://mieyar-website.fly.dev'

[mounts]
  source = 'agent_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
